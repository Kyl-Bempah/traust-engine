pack: security
route_on: repo_state
assets:
  feeds_cache:
    run: [python3, -m, traust.cli, feeds, fetch, --feed, all]
    every: 24h
    priority: 10
    freshness: {warn: 36h, fail: 48h}
    runner: {labels: ["egress:public"]}

  repo_state:
    partitions: repository
    run: [python3, -m, traust.cli, observe, repo-state, --repo, "{repo_url}"]
    every: 24h
    priority: 20
    quota: {per_hour: 2}
    runner: {labels: ["forge:{host}"]}

  dependency_graph:
    partitions: repository
    deps: [repo_state, feeds_cache]
    every: 7d
    priority: 50

  diff_scan:
    partitions: repository
    deps: [repo_state]
    lanes: [diff-scan, diff-scan-quarterly]
    estimate_usd: "2.00"
    run: [/vuln-scan, --diff, --, "{repo_url}"]
